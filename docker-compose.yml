services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cdss-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped
    networks:
      - cdss-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: cdss-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - cdss-network

networks:
  cdss-network:
    driver: bridge
